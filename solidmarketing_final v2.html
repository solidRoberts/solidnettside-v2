  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#0a0a0a;--dark:#111;--surface:#181818;--border:#2a2a2a;--muted:#b0b0b0;--light:#ede9e0;--white:#f5f2ec;--gold:#c8a96e;--gold-dim:#8a6e3e;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
    html{scroll-behavior:smooth}
    body{background:var(--black);color:var(--light);font-family:var(--sans);font-size:16px;line-height:1.7;font-weight:300;overflow-x:hidden}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.5rem 4rem;border-bottom:1px solid transparent;transition:background .4s,border-color .4s}
    nav.scrolled{background:rgba(10,10,10,.95);border-color:var(--border);backdrop-filter:blur(12px)}
    .nav-logo{font-family:var(--serif);font-size:1.5rem;font-weight:600;letter-spacing:.04em;color:var(--white);text-decoration:none}
    .nav-logo span{color:var(--gold)}
    .nav-links{display:flex;gap:2.5rem;list-style:none}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;transition:color .2s}
    .nav-links a:hover{color:var(--white)}
    .nav-cta{background:none;border:1px solid var(--gold-dim);color:var(--gold);padding:.55rem 1.4rem;font-family:var(--sans);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s;text-decoration:none}
    .nav-cta:hover{background:var(--gold);color:var(--black)}
    .hero{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 4rem 8rem;position:relative;overflow:hidden}
    .hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 80% 30%,rgba(200,169,110,.07) 0%,transparent 60%),radial-gradient(ellipse 40% 60% at 20% 70%,rgba(200,169,110,.04) 0%,transparent 50%)}
    .hero-line{position:absolute;top:0;bottom:0;left:55%;width:1px;background:linear-gradient(to bottom,transparent,var(--border) 30%,var(--border) 70%,transparent);opacity:.5}
    .hero-tag{font-size:.78rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:2rem;opacity:0;animation:fadeUp .8s .2s forwards}
    .hero h1{font-family:var(--serif);font-size:clamp(3.5rem,8vw,7.5rem);font-weight:500;line-height:1;letter-spacing:-.01em;color:var(--white);max-width:14ch;opacity:0;animation:fadeUp .9s .4s forwards}
    .hero h1 em{font-style:italic;color:var(--gold)}
    .hero-sub{margin-top:2.5rem;max-width:38ch;color:var(--muted);font-size:1rem;line-height:1.8;opacity:0;animation:fadeUp .9s .6s forwards}
    .hero-actions{display:flex;align-items:center;gap:2rem;margin-top:3rem;opacity:0;animation:fadeUp .9s .8s forwards}
    .btn-primary{background:var(--gold);color:var(--black);padding:1rem 2.2rem;font-family:var(--sans);font-size:.85rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:none;cursor:pointer;transition:opacity .2s;display:inline-block}
    .btn-primary:hover{opacity:.85}
    .btn-ghost{color:var(--muted);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;transition:color .2s;display:flex;align-items:center;gap:.5rem}
    .btn-ghost:hover{color:var(--white)}
    .hero-scroll{position:absolute;bottom:3rem;right:4rem;writing-mode:vertical-lr;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--border);opacity:0;animation:fadeIn 1s 1.2s forwards}
    .stats{border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr)}
    .stat{padding:3rem 4rem;border-right:1px solid var(--border)}
    .stat:last-child{border-right:none}
    .stat-num{font-family:var(--serif);font-size:3.5rem;font-weight:500;color:var(--gold);line-height:1}
    .stat-label{margin-top:.5rem;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .stat-sub{margin-top:.6rem;font-size:.85rem;color:#aaaaaa;line-height:1.6;font-style:italic}
    section{padding:8rem 4rem}
    .section-tag{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:1.5rem}
    .section-title{font-family:var(--serif);font-size:clamp(2.2rem,4vw,3.5rem);font-weight:500;line-height:1.15;color:var(--white);max-width:20ch}
    .section-title em{font-style:italic;color:var(--gold)}
    .section-body{color:var(--muted);max-width:42ch;margin-top:1.5rem;line-height:1.9}
    .services-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:5rem;border:1px solid var(--border)}
    .service-card{padding:3rem;border-right:1px solid var(--border);border-bottom:1px solid var(--border);transition:background .3s;position:relative;overflow:hidden}
    .service-card:nth-child(even){border-right:none}
    .service-card:nth-child(3),.service-card:nth-child(4){border-bottom:none}
    .service-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .4s}
    .service-card:hover{background:var(--surface)}
    .service-card:hover::before{transform:scaleX(1)}
    .service-num{font-family:var(--serif);font-size:.9rem;color:var(--gold-dim);margin-bottom:1.5rem}
    .service-title{font-family:var(--serif);font-size:1.6rem;font-weight:500;color:var(--white);margin-bottom:1rem}
    .service-desc{color:var(--muted);font-size:.92rem;line-height:1.8}
    .about{display:grid;grid-template-columns:1fr 1fr;gap:8rem;align-items:center}
    .about-values{margin-top:3rem;display:flex;flex-direction:column;gap:0}
    .value-item{display:flex;align-items:baseline;gap:1.5rem;padding:1.2rem 0;border-bottom:1px solid var(--border)}
    .value-item:first-child{border-top:1px solid var(--border)}
    .value-num{font-family:var(--serif);font-size:.8rem;color:var(--gold-dim);min-width:2rem}
    .value-name{font-size:.9rem;color:var(--light);letter-spacing:.04em}
    .about-visual{position:relative;height:480px}
    .about-box{position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
    .about-box-inner{font-family:var(--serif);font-size:5rem;font-weight:500;color:var(--border);line-height:1}
    .about-badge{position:absolute;bottom:-1.5rem;right:-1.5rem;background:var(--gold);color:var(--black);padding:2rem;font-family:var(--serif);font-size:1rem;font-weight:600;line-height:1.3;text-align:center}
    .team-section{background:var(--dark)}
    .team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;margin-top:5rem;max-width:800px}
    .team-card{background:var(--surface);padding:3rem;transition:background .3s}
    .team-card:hover{background:#1f1f1f}
    .team-name{font-family:var(--serif);font-size:1.6rem;font-weight:500;color:var(--white)}
    .team-role{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:.3rem;margin-bottom:1.5rem}
    .team-contact a{display:block;color:var(--muted);text-decoration:none;font-size:.88rem;transition:color .2s;margin-bottom:.2rem}
    .team-contact a:hover{color:var(--gold)}
    .contact-section{background:var(--black);border-top:1px solid var(--border)}
    .contact-inner{display:grid;grid-template-columns:1fr 1fr;gap:8rem;align-items:start}
    .contact-form{display:flex;flex-direction:column;gap:1.2rem;margin-top:3rem}
    .form-group{display:flex;flex-direction:column;gap:.4rem}
    .form-group label{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .form-group input,.form-group textarea,.form-group select{background:var(--surface);border:1px solid var(--border);color:var(--white);padding:.9rem 1.1rem;font-family:var(--sans);font-size:.92rem;font-weight:300;outline:none;transition:border-color .2s;width:100%}
    .form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--gold-dim)}
    .form-group textarea{resize:vertical;min-height:120px}
    .form-group select option{background:var(--surface)}
    .form-status{display:none;padding:1rem 1.2rem;font-size:.88rem;border:1px solid;margin-bottom:.5rem}
    .form-status.success{border-color:#2a5c3a;background:#0d1f14;color:#a8d4b4}
    .form-status.error{border-color:#5c2a2a;background:#1f0d0d;color:#d4a8a8}
    .contact-info-block{margin-top:3rem}
    .contact-info-item{padding:1.5rem 0;border-bottom:1px solid var(--border)}
    .contact-info-item:first-child{border-top:1px solid var(--border)}
    .contact-info-label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:.4rem}
    .contact-info-value{color:var(--light);font-size:.95rem}
    .contact-info-value a{color:var(--light);text-decoration:none;transition:color .2s}
    .contact-info-value a:hover{color:var(--gold)}
    footer{background:var(--dark);border-top:1px solid var(--border);padding:3rem 4rem;display:flex;align-items:center;justify-content:space-between}
    .footer-logo{font-family:var(--serif);font-size:1.2rem;color:var(--white)}
    .footer-logo span{color:var(--gold)}
    .footer-copy{font-size:.8rem;color:var(--muted)}
    .footer-links{display:flex;gap:2rem}
    .footer-links a{font-size:.8rem;color:var(--muted);text-decoration:none;transition:color .2s}
    .footer-links a:hover{color:var(--white)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .reveal{opacity:0;transform:translateY(32px);transition:opacity .7s,transform .7s}
    .reveal.visible{opacity:1;transform:none}
    @media(max-width:900px){
      nav{padding:1.2rem 2rem}
      .nav-links{display:none}
      .hero{padding:0 2rem 6rem}
      section{padding:5rem 2rem}
      .stats{grid-template-columns:1fr}
      .stat{border-right:none;border-bottom:1px solid var(--border)}
      .services-grid{grid-template-columns:1fr}
      .service-card{border-right:none}
      .service-card:nth-child(3){border-bottom:1px solid var(--border)}
      .about{grid-template-columns:1fr;gap:3rem}
      .about-visual{height:260px}
      .contact-inner{grid-template-columns:1fr;gap:3rem}
      .team-grid{grid-template-columns:1fr}
      footer{flex-direction:column;gap:1.5rem;text-align:center;padding:2.5rem 2rem}
    }
  </style>
</head>

  <script>
    function em(t,k){return k?t.replace(k,'<em>'+k+'</em>'):t}
    document.title=SITE.tittel;
    document.getElementById('hero-tag').textContent=SITE.hero.tag;
    document.getElementById('hero-h1').innerHTML=em(SITE.hero.overskrift,SITE.hero.overskrift_kursiv);
    document.getElementById('hero-sub').textContent=SITE.hero.ingress;
    document.getElementById('hero-btn1').textContent=SITE.hero.knapp1;
    document.getElementById('hero-btn2').textContent=SITE.hero.knapp2+' ->';
    var ss=document.getElementById('stats-strip');
    SITE.stats.forEach(function(s){ss.innerHTML+='<div class="stat reveal"><div class="stat-num">'+s.tall+'</div><div class="stat-label">'+s.tekst+'</div>'+(s.sub?'<div class="stat-sub">'+s.sub+'</div>':'')+'</div>';});
    document.getElementById('tj-tag').textContent=SITE.tjenester.tag;
    document.getElementById('tj-title').innerHTML=em(SITE.tjenester.overskrift,SITE.tjenester.overskrift_kursiv);
    document.getElementById('tj-body').textContent=SITE.tjenester.ingress;
    var sg=document.getElementById('services-grid');
    SITE.tjenester.kort.forEach(function(k,i){sg.innerHTML+='<div class="service-card reveal"><div class="service-num">0'+(i+1)+'</div><div class="service-title">'+k.tittel+'</div><div class="service-desc">'+k.tekst+'</div></div>';});
    document.getElementById('om-tag').textContent=SITE.omOss.tag;
    document.getElementById('om-title').innerHTML=em(SITE.omOss.overskrift,SITE.omOss.overskrift_kursiv);
    document.getElementById('om-body').textContent=SITE.omOss.tekst;
    document.getElementById('about-badge').textContent=SITE.omOss.sted;
    var av=document.getElementById('about-values');
    SITE.omOss.verdier.forEach(function(v){av.innerHTML+='<div class="value-item reveal"><span class="value-num">-</span><span class="value-name">'+v+'</span></div>';});
    document.getElementById('team-tag').textContent=SITE.team.tag;
    document.getElementById('team-title').innerHTML=em(SITE.team.overskrift,SITE.team.overskrift_kursiv);
    document.getElementById('team-body').textContent=SITE.team.ingress;
    var tg=document.getElementById('team-grid');
    SITE.team.personer.forEach(function(p){tg.innerHTML+='<div class="team-card reveal"><div class="team-name">'+p.navn+'</div><div class="team-role">'+p.rolle+'</div><div class="team-contact"><a href="mailto:'+p.epost+'">'+p.epost+'</a><a href="tel:'+p.tlf.replace(/\s/g,'')+'">'+p.tlf+'</a></div></div>';});
    var k=SITE.kontakt;
    document.getElementById('k-tag').textContent=k.tag;
    document.getElementById('k-title').innerHTML=em(k.overskrift,k.overskrift_kursiv);
    document.getElementById('k-body').textContent=k.ingress;
    document.getElementById('contact-info').innerHTML='<div class="contact-info-item reveal"><div class="contact-info-label">E-post</div><div class="contact-info-value"><a href="mailto:'+k.epost+'">'+k.epost+'</a></div></div><div class="contact-info-item reveal"><div class="contact-info-label">Adresse</div><div class="contact-info-value">'+k.adresse+'</div></div><div class="contact-info-item reveal"><div class="contact-info-label">Telefon</div><div class="contact-info-value">'+k.telefon.map(function(t){return'<a href="tel:'+t.replace(/\s/g,'')+'">'+t+'</a>';}).join(' / ')+'</div></div>';
    var sel=document.getElementById('budsjett-select');
    sel.innerHTML='<option value="">Velg budsjett</option>';
    k.budsjett_valg.forEach(function(b){sel.innerHTML+='<option>'+b+'</option>';});
    document.getElementById('footer-copy').textContent=SITE.footer.kopi;
    document.getElementById('contact-form').addEventListener('submit',async function(e){
      e.preventDefault();
      var btn=document.getElementById('form-btn'),st=document.getElementById('form-status');
      btn.textContent='Sender...';btn.disabled=true;st.style.display='none';
      try{
        var r=await fetch(SITE.kontakt.formspree_url,{method:'POST',headers:{'Accept':'application/json'},body:new FormData(this)});
        if(r.ok){st.className='form-status success';st.textContent='Takk! Vi tar kontakt med deg snart.';st.style.display='block';this.reset();btn.textContent='Sendt!';}
        else throw new Error();
      }catch(err){st.className='form-status error';st.textContent='Noe gikk galt. Send e-post direkte til '+SITE.kontakt.epost;st.style.display='block';btn.textContent='Prøv igjen';btn.disabled=false;}
    });
    var nav=document.getElementById('nav');
    window.addEventListener('scroll',function(){nav.classList.toggle('scrolled',window.scrollY>40);});
    var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});},{threshold:.12});
    document.querySelectorAll('.reveal').forEach(function(el){obs.observe(el);});
  </script>
</body>
</html>
